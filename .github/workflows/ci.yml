# Runs the backend and frontend test suites on every pull request and on master.
# A push to a branch with an open PR is covered by pull_request, so branch pushes
# don't trigger a second run.
# Actions are pinned to a commit, with its version in a comment; Dependabot keeps the pins
# current (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The README's minimum and the newest release.
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # requirements-dev.txt includes requirements.txt and adds pytest and ruff.
      - run: pip install -r requirements-dev.txt
      # Lint rules only (ruff.toml), no formatting; GitHub output marks findings on the PR's lines.
      - run: python -m ruff check --output-format=github .
      # The tests fake Ollama and use a temporary database per test.
      - run: python -m pytest

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The oldest Node LTS still maintained.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ESLint on every file (#258). The warnings are the known set-state-in-effect ones that wait
      # for the UI redesign (eslint.config.js); a new warning fails the run, so lower the number
      # as they go.
      - run: npm run lint -- --max-warnings 13
      - run: npm test
      - run: npm run build
