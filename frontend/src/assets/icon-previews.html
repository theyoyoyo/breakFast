<!DOCTYPE html>
<html><head><style>
body { background: #1a1a2e; display: flex; gap: 30px; justify-content: center; align-items: flex-start; min-height: 100vh; flex-wrap: wrap; padding: 40px 20px; font-family: sans-serif; color: #ccc; }
h2 { width: 100%; text-align: center; font-size: 14px; color: #888; margin: 20px 0 4px; }

/* simulated chat area */
.chat-area {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.chatbar {
  width: 100%;
  background: #2a2a3e;
  border-radius: 16px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.chatbar input {
  flex: 1;
  background: transparent;
  border: none;
  color: #ccc;
  font-size: 14px;
  outline: none;
}
.chatbar .send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #4a4a6a;
  border: none;
  color: #ccc;
  font-size: 16px;
  cursor: pointer;
}

.suggest-btn {
  border-radius: 12px;
  border: none;
  cursor: pointer;
  padding: 6px 12px;
  transition: transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.suggest-btn:hover { transform: scale(1.05); }
.suggest-btn img { display: block; height: auto; }
</style></head><body>

<h2>— Chat bar üstünde geniş buton (u2) —</h2>
<div class="chat-area">
  <button class="suggest-btn" style="background: #2a2a3e; width: 100%;"><img src="./u2.png" style="width: 100%; max-height: 80px; object-fit: contain;"></button>
  <div class="chatbar">
    <input type="text" placeholder="Mesajınızı yazın..." />
    <button class="send-btn">↑</button>
  </div>
</div>

<h2>— Chat bar üstünde geniş buton (u3) —</h2>

  <button class="suggest-btn" style="background: #2a2a3e; width: 100%;"><img src="./u3.png" style="width: 100%; max-height: 80px; object-fit: contain;"></button>
  <div class="chatbar">
    <input type="text" placeholder="Mesajınızı yazın..." />

  </div>
</div>

  <div class="chatbar">
    <input type="text" placeholder="Mesajınızı yazın..." />
    <button class="send-btn">↑</button>
  </div>
</div>

<h2>— Daha kompakt (u3, max-height: 56px) —</h2>
<div class="chat-area">
  <button class="suggest-btn" style="background: #2a2a3e; width: 100%;"><img src="./u3.png" style="width: 100%; max-height: 56px; object-fit: contain;"></button>

    <input type="text" placeholder="Mesajınızı yazın..." />

<h2>— Glass arka plan (u2, 80px) —</h2>
<div class="chat-area">
  <button class="suggest-btn" style="background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12); width: 100%;"><img src="./u2.png" style="width: 100%; max-height: 80px; object-fit: contain;"></button>
  <div class="chatbar">
    <input type="text" placeholder="Mesajınızı yazın..." />
    <button class="send-btn">↑</button>
  </div>
</div>

<h2>— Arka plansız (u2, 80px) —</h2>
<div class="chat-area">
  <button class="suggest-btn" style="background: transparent; width: 100%;"><img src="./u2.png" style="width: 100%; max-height: 80px; object-fit: contain;"></button>
  <div class="chatbar">
    <input type="text" placeholder="Mesajınızı yazın..." />
    <button class="send-btn">↑</button>
  </div>
</div>

</body></html>
