[pytest]
# Async tests and fixtures run without @pytest.mark.asyncio, each on its own event loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Every warning fails the run, so a deprecation in the app's own code shows up in CI.
# Each ignore below is a third-party warning that can't be fixed here, kept as narrow as it gets.
filterwarnings =
    error
    # Starlette's TestClient asks for the httpx2 package; the app itself uses httpx (llm.py),
    # so the tests stay on it until Starlette drops the fallback.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
markers =
    real_scrypt: hash PINs at the production scrypt cost
